version: '3.8'

services:
  stats-db:
    image: postgres:16.1
    container_name: ewm-stats-db
    environment:
      POSTGRES_DB: stats_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - stats_db_data:/var/lib/postgresql/data

  stats-server:
    build:
      context: .
      dockerfile: stats/server/Dockerfile
    container_name: ewm-stats-server
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - stats-db

  ewm-db:
    image: postgres:16.1
    container_name: ewm-main-db
    environment:
      POSTGRES_DB: ewm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ewm_db_data:/var/lib/postgresql/data

  ewm-service:
    build:
      context: .
      dockerfile: main-server/Dockerfile
    container_name: ewm-main-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      STATS_SERVER_URL: http://stats-server:9090
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - ewm-db
      - stats-server

volumes:
  stats_db_data:
  ewm_db_data: